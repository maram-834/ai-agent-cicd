name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'   # same as the Dockerfile; Django 6.1 needs 3.12+

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

  deploy:
    needs: test
    runs-on: [self-hosted, agent-deploy]
    permissions:
      contents: read
      packages: read
    env:
      REPO: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check Docker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker pull --platform linux/amd64 "ghcr.io/$($env:REPO.ToLower()):latest"
          exit $LASTEXITCODE

      - name: Start or replace the app container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $image = "ghcr.io/$($env:REPO.ToLower()):latest"

          $existing = docker ps -aq --filter "name=^/agent-app$"
          if ($existing) {
            docker rm -f agent-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name agent-app `
            -e GEMINI_API_KEY=$env:GEMINI_API_KEY `
            -p 127.0.0.1:8000:8000 $image
          exit $LASTEXITCODE
